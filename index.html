<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <link rel="stylesheet" href="style.css">


</head>

<body>

    <main class="container">

        <section class="registration-card">

            <header>

                <h1>🎓 Student Registration Portal</h1>

                <p>
                    Complete all required fields to register for the upcoming academic session.
                </p>

            </header>

            <form id="registrationForm">

                <!-- Personal Information -->



                <section>

                    <h2>👤 Personal Information</h2>

                    <div class="row">

                        <div class="form-group">

                            <label for="first-name">First Name</label>

                            <input type="text" id="first-name" name="first-name" placeholder="Enter your first name"
                                required>

                        </div>

                        <div class="form-group">

                            <label for="middle-name">Middle Name</label>

                            <input type="text" id="middle-name" name="middle-name" placeholder="Enter your middle name">

                        </div>

                    </div>

                    <div class="row">

                        <div class="form-group">

                            <label for="last-name">Last Name</label>

                            <input type="text" id="last-name" name="last-name" placeholder="Enter your last name"
                                required>

                        </div>

                        <div class="form-group">

                            <label for="dob">Date of Birth</label>

                            <input type="date" id="dob" name="dob" required>

                        </div>

                    </div>

                    <div class="form-group">

                        <label>Gender</label>

                        <div class="radio-group">

                            <label>

                                <input type="radio" name="gender" value="Male" required>

                                Male

                            </label>

                            <label>

                                <input type="radio" name="gender" value="Female">

                                Female

                            </label>

                            <label>

                                <input type="radio" name="gender" value="Other">

                                Other

                            </label>

                        </div>

                    </div>

                </section>


                <!-- =========================
     Contact Information
========================= -->

                <section>

                    <h2>📞 Contact Information</h2>

                    <div class="row">

                        <div class="form-group">

                            <label for="email">Email Address</label>

                            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                        </div>

                        <div class="form-group">

                            <label for="phone">Mobile Number</label>

                            <input type="tel" id="phone" name="phone" placeholder="Enter your mobile number"
                                pattern="[0-9]{10}" maxlength="10" required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="form-group">

                            <label for="city">City</label>

                            <input type="text" id="city" name="city" placeholder="Enter your city" required>

                        </div>

                        <div class="form-group">

                            <label for="state">State</label>

                            <input type="text" id="state" name="state" placeholder="Enter your state" required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="form-group">

                            <label for="pincode">PIN Code</label>

                            <input type="text" id="pincode" name="pincode" placeholder="Enter your PIN Code"
                                pattern="[0-9]{6}" maxlength="6" required>

                        </div>

                        <div class="form-group">

                            <label for="country">Country</label>

                            <input type="text" id="country" name="country" placeholder="Enter your country"
                                value="India" required>

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="address">Residential Address</label>

                        <textarea id="address" name="address" rows="4"
                            placeholder="Enter your complete residential address" required></textarea>

                    </div>

                </section>



                <!-- =========================
     Academic Information
========================= -->

                <section>

                    <h2>🎓 Academic Information</h2>

                    <div class="row">

                        <div class="form-group">

                            <label for="school-name">School Name</label>

                            <input type="text" id="school-name" name="school-name" placeholder="Enter your school name"
                                required>

                        </div>

                        <div class="form-group">

                            <label for="roll-number">Roll Number</label>

                            <input type="text" id="roll-number" name="roll-number" placeholder="Enter your roll number"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="form-group">

                            <label for="board">Education Board</label>

                            <select id="board" name="board" required>

                                <option value="">-- Select Board --</option>
                                <option>GSEB</option>
                                <option>CBSE</option>
                                <option>ICSE</option>
                                <option>IB</option>
                                <option>Other</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="class">Class / Standard</label>

                            <select id="class" name="class" required>

                                <option value="">-- Select Class --</option>
                                <option>9</option>
                                <option>10</option>
                                <option>11</option>
                                <option>12</option>

                            </select>

                        </div>

                    </div>

                    <div class="row">

                        <div class="form-group">

                            <label for="stream">Stream</label>

                            <select id="stream" name="stream" required>

                                <option value="">-- Select Stream --</option>
                                <option>Science</option>
                                <option>Commerce</option>
                                <option>Arts</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="admission-number">Admission Number</label>

                            <input type="text" id="admission-number" name="admission-number"
                                placeholder="Enter admission number">

                        </div>

                    </div>

                </section>



                <!-- =========================
     Additional Details
========================= -->

                <section>

                    <h2>📋 Additional Details</h2>

                    <label for="blood-group">Blood Group</label>
                    <select id="blood-group" name="blood-group" required>

                        <option value="">-- Select Blood Group --</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>

                    </select>

                    <label>Hobbies</label>

                    <input type="checkbox" id="reading" name="hobbies" value="Reading">
                    <label for="reading">Reading</label>

                    <input type="checkbox" id="sports" name="hobbies" value="Sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music" name="hobbies" value="Music">
                    <label for="music">Music</label>

                    <input type="checkbox" id="coding" name="hobbies" value="Coding">
                    <label for="coding">Coding</label>

                    <label for="photo">Passport Size Photo</label>
                    <input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png" required>

                    <label for="about">About Yourself</label>
                    <textarea id="about" name="about" rows="5"
                        placeholder="Tell us something about yourself..."></textarea>

                </section>



                <!-- =========================
     Declaration & Buttons
========================= -->

                <section>

                    <h2>✅ Declaration & Submit</h2>

                    <div class="form-group">

                        <label class="declaration">

                            <input type="checkbox" id="declaration" name="declaration" required>

                            I hereby declare that all the information provided by me in this registration form is true
                            and correct to the best of my knowledge.

                        </label>

                    </div>

                    <div class="button-group">

                        <button type="reset" class="reset-btn">

                            Reset Form

                        </button>

                        <button type="submit" class="submit-btn">

                            Submit Registration

                        </button>

                    </div>

                </section>
            </form>

            <footer>

                <p>

                    © 2026 Student Registration Portal

                    <br>

                    Designed & Developed by <strong>Saalim Pathan</strong>

                </p>

            </footer>

        </section>

    </main>
    <script src="script.js"></script>

</body>

</html>
